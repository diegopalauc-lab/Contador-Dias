<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Contador"><meta name="theme-color" content="#101827"><title>Contador de días</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#101827,#263c58);color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}.card{width:min(100%,440px)}.label{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#b7c8dc}.count{font-size:clamp(55px,14vw,85px);font-weight:750;letter-spacing:-4px;margin:25px 0 5px}.sub{font-size:20px;color:#c7d5e6}.track{height:9px;background:#ffffff2a;border-radius:20px;margin:35px 0 12px;overflow:hidden}.bar{height:100%;background:#80c8ff;width:0%;border-radius:20px;transition:width .5s}.dates{display:flex;justify-content:space-between;font-size:13px;color:#b7c8dc}.note{margin-top:40px;color:#b7c8dc;font-size:14px}</style></head><body><main class="card"><div class="label">Cuenta de días</div><div class="count" id="count">Día 0 de 27</div><div class="sub" id="status">21 octubre — 17 noviembre 2026</div><div class="track"><div class="bar" id="bar"></div></div><div class="dates"><span>21 OCT</span><span>17 NOV</span></div><div class="note">Se actualiza automáticamente cada día · Hora de Madrid</div></main><script>function update(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(x=>[x.type,x.value]));const today=Date.UTC(+o.year,+o.month-1,+o.day);const start=Date.UTC(2026,9,21),end=Date.UTC(2026,10,17),total=(end-start)/86400000;const n=Math.round((today-start)/86400000);document.getElementById('count').textContent='Día '+Math.max(0,Math.min(total,n))+' de '+total;document.getElementById('bar').style.width=(Math.max(0,Math.min(total,n))/total*100)+'%';if(n<0)document.getElementById('status').textContent='Comienza el 21 de octubre de 2026';else if(n>total)document.getElementById('status').textContent='Período finalizado';}update();setInterval(update,60000)</script></body></html>
